mode = "light"

# Tower 49: white and pale grey glass above the clouds at dawn, dark slate text,
# and the pale blue of the drone and Bubbleship displays. Text colours are
# deep enough to read on the white: the normal colours at least 5:1 on the
# background, the bright ones and muted (terminal colour 8, secondary text)
# 4.5:1.
accent = "#3d9ad1"
selection = "#cde4f3"
muted = "#64717f"

background = "#f3f6f9"
dark_background = "#e9eef3"
darker_background = "#dde4eb"
lighter_background = "#e3ecf4"

foreground = "#1c2733"
dark_foreground = "#566573"
light_foreground = "#2b3845"
bright_foreground = "#0b1219"

active_border_color = "#3d9ad1"
active_tab_background = "#3d9ad1"
hyprland_active_border = "rgba(3d9ad1ee) rgba(a6d8f2ee) 90deg"
hyprland_inactive_border = "rgba(a9b9c8aa)"

red = "#ba3e35"
yellow = "#8b6100"
orange = "#aa4e00"
green = "#16784e"
cyan = "#007294"
blue = "#266ab7"
magenta = "#8152b9"
brown = "#7a5636"

bright_red = "#bf493f"
bright_yellow = "#936800"
bright_green = "#108054"
bright_cyan = "#007a9b"
bright_blue = "#3172bb"
bright_magenta = "#875abc"

# Frosted white glass (film.lua): the backdrop under the windows is near white
# and film.lua keeps a light film's frost bright, so the glass never greys the
# pane below the white the apps chose their dimmer text against.
glass = "0.7"

# Reaches furthest (contract.glsl, REACH): its lift's light, exp(-d / 120).
reach = "600"
